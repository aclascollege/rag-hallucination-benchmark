name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: |
          for f in corpus.py questions.py rag.py grade.py grading_final.py onnx_embed.py; do
            python -m py_compile "$f" && echo "$f OK"
          done
      - name: Validate JSON
        run: |
          python -c "import json; [json.load(open(f)) for f in ['questions.json','grading_final.json','corpus_chunks_500.json','corpus_chunks_1000.json']]; print('JSON OK')"
      - name: Check report
        run: test -f REPORT.md && echo "REPORT.md OK"

